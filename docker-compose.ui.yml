# Optional Stage 12 validation overlay. Keep the team's docker-compose.yml intact.
# Requires Docker Compose >= 2.24.4 for !reset.
services:
  mongo1:
    ports: !reset []
  mongo2:
    ports: !reset []
  mongo3:
    ports: !reset []
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27018,mongo3:27019/?replicaSet=rs0
      MONGO_DB_NAME: football_scouting
      PYTHONUTF8: "1"
    ports:
      - "127.0.0.1:8766:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data:ro
